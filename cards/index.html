<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회의용 선호 카드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: #1d2321; color: #fff; word-break: keep-all;
    padding: calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 32px);
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 800; line-height: 1.3; text-align: center; }
  .sub { text-align: center; color: #c9d2cd; font-size: 14px; margin-top: 8px; line-height: 1.6; }
  h2 { font-size: 16px; font-weight: 700; margin: 28px 2px 10px; }
  .go {
    display: block; text-decoration: none; color: #fff; border-radius: 16px;
    padding: 18px; margin-bottom: 12px; font-size: 18px; font-weight: 800;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
  }
  .go small { display: block; font-size: 13px; font-weight: 500; opacity: .9; margin-top: 4px; }
  .crew { background: linear-gradient(90deg,#1f5fae,#c85a0c,#1a8455,#7a36b3); }
  .pref { background: linear-gradient(90deg,#f5c33b,#3e4c5e,#9a6a2f,#2f86c0,#0f7c7c,#d6487e,#6b7a1f,#8fbf2a); }
  .tip { font-size: 13px; color: #a9b3ae; line-height: 1.6; margin: -2px 2px 10px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
  .row a img { width: 100%; border-radius: 8px; display: block; }
  .row a { text-decoration: none; }
  .row a span { display: block; text-align: center; font-size: 12px; color: #c9d2cd; margin-top: 4px; }
  footer { text-align: center; font-size: 11.5px; color: #8f9893; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>회의용 선호 카드</h1>
  <p class="sub">내가 불편해지면, 카드를 꺼내요.</p>

  <h2>카드 열기</h2>
  <a class="go crew" href="crew.html">크루(기질) 카드<small>살림꾼 · 해결사 · 연결자 · 설계자<br>+ 내향 · 외향</small></a>
  <a class="go pref" href="pref8.html">8가지 선호지표 카드<small>E · I · S · N · T · F · J · P</small></a>

  <h2>배경화면 받기</h2>
  <p class="tip">이미지를 눌러 크게 연 다음,<br>길게 눌러 저장하세요.</p>
  <div id="walls"></div>

  <footer>made by ehanyeong</footer>
</main>
<script>
const sets = [
  ['크루 · 한마디', 'crew', ['SJ','SP','NF','NT','I','E']],
  ['크루 · 색만', 'crew-color', ['SJ','SP','NF','NT','I','E']],
  ['8가지 선호지표', 'pref8', ['E','I','S','N','T','F','J','P']]
];
const root = document.getElementById('walls');
sets.forEach(([title, dir, codes]) => {
  const h = document.createElement('p');
  h.className = 'tip'; h.style.color = '#eef2f0'; h.style.fontWeight = '700';
  h.textContent = title;
  root.appendChild(h);
  const row = document.createElement('div');
  row.className = 'row';
  codes.forEach(c => {
    row.insertAdjacentHTML('beforeend',
      `<a href="wallpapers/${dir}/${c}.png"><img src="wallpapers/${dir}/${c}.png" alt="${c} 배경화면" loading="lazy"><span>${c}</span></a>`);
  });
  root.appendChild(row);
});
</script>
</body>
</html>
